apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: licitaciones
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: sistema-gestion-licitaciones
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
  # Sin storageClassName explícito: usa la StorageClass por defecto del
  # clúster. Ajustar según el proveedor si no hay una por defecto.
