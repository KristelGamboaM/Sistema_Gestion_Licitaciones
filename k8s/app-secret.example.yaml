# Plantilla de ejemplo — NO contiene credenciales reales.
# Copiar a "app-secret.yaml" (ignorado por git, ver .gitignore), reemplazar
# los valores y aplicar con `kubectl apply -f k8s/app-secret.yaml` antes que
# el resto de los manifiestos. Nunca versionar el archivo con valores reales.
apiVersion: v1
kind: Secret
metadata:
  name: licitaciones-secrets
  namespace: licitaciones
type: Opaque
stringData:
  POSTGRES_PASSWORD: "reemplazar-con-una-contrasena-real"
  ConnectionStrings__LicitacionesDb: "Host=postgres;Port=5432;Database=licitaciones;Username=licitaciones;Password=reemplazar-con-una-contrasena-real"
