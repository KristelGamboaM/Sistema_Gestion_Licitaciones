# Manifiesto adicional (no exigido por el nombre exacto en el enunciado,
# que solo pide "app-deployment.yaml") para desplegar también la API REST,
# necesaria para que la interfaz Web y los consumidores externos funcionen
# por completo. Sigue el mismo patrón que app-deployment.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: licitaciones-api
  namespace: licitaciones
  labels:
    app.kubernetes.io/name: licitaciones-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: licitaciones-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: licitaciones-api
    spec:
      initContainers:
        - name: migrate
          image: sistema_gestion_licitaciones-migrate:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: licitaciones-config
            - secretRef:
                name: licitaciones-secrets
      containers:
        - name: api
          image: sistema_gestion_licitaciones-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: licitaciones-config
            - secretRef:
                name: licitaciones-secrets
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 384Mi
          startupProbe:
            httpGet:
              path: /swagger/v1/swagger.json
              port: http
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /swagger/v1/swagger.json
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /swagger/v1/swagger.json
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
          securityContext:
            runAsNonRoot: true
            runAsUser: 5678
            allowPrivilegeEscalation: false
